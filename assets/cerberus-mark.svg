<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Cerberus — guardian of your digital memory</title>
<desc id="desc">Three charcoal hellhound heads with glowing amber eyes inside a teal and copper portal, beside a Cerberus wordmark.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e2b"/><stop offset="1" stop-color="#091118"/></linearGradient>
  <linearGradient id="ring" x2="1" y2="1"><stop stop-color="#24d3bf"/><stop offset=".48" stop-color="#375d5a"/><stop offset="1" stop-color="#f59a53"/></linearGradient>
  <linearGradient id="word" x2="0" y2="1"><stop stop-color="#fff2d7"/><stop offset="1" stop-color="#e5ae71"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x="0" y="0" width="1000" height="380" rx="28" fill="url(#bg)"/>

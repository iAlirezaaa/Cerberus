<g fill="#ffc16b"><ellipse cx="142" cy="184" rx="7" ry="4"/><ellipse cx="206" cy="184" rx="7" ry="4"/><ellipse cx="178" cy="180" rx="8" ry="5"/><ellipse cx="207" cy="180" rx="8" ry="5"/></g>

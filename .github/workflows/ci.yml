name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests / Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q cerberus tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m cerberus --help
          python -m cerberus add-text "Cerberus CI smoke test"
          python -m cerberus search "Cerberus"
        env:
          CERBERUS_HOME: ${{ runner.temp }}/cerberus-ci

  gui-smoke:
    name: Qt offscreen smoke / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI dependencies
        run: python -m pip install -e ".[gui]"
      - name: Render mascot and smoke test desktop controller
        run: python -m unittest discover -s tests -p "test_gui_smoke.py" -v
        env:
          QT_QPA_PLATFORM: offscreen
          CERBERUS_HOME: ${{ runner.temp }}/cerberus-gui

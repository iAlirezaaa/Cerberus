name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "cerberus/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Build unsigned Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and packager
        run: python -m pip install -e ".[gui]" "pyinstaller>=6,<7"
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Cerberus scripts/run_desktop.py
      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Windows-unsigned
          path: dist/Cerberus.exe
          if-no-files-found: error
          retention-days: 14

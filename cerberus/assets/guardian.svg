<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="600" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
<title id="title">Cerberus, three-headed guardian desktop pet</title>
<desc id="desc">An original charcoal-furred three-headed hellhound with fiery amber eyes, gold collar and teal cloth accents. Transparent background.</desc>
<defs>
  <linearGradient id="fur" x1=".1" x2=".85" y1="0" y2="1"><stop stop-color="#59606a"/><stop offset=".3" stop-color="#353b48"/><stop offset=".72" stop-color="#242934"/><stop offset="1" stop-color="#121923"/></linearGradient>
  <linearGradient id="body" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#47505d"/><stop offset=".55" stop-color="#2c3440"/><stop offset="1" stop-color="#111923"/></linearGradient>
  <linearGradient id="muzzle" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#58616a"/><stop offset="1" stop-color="#303947"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffda91"/><stop offset=".33" stop-color="#d69d48"/><stop offset=".7" stop-color="#99602f"/><stop offset="1" stop-color="#f2b668"/></linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#df7053"/><stop offset=".56" stop-color="#b84d40"/><stop offset="1" stop-color="#4e2934"/></linearGradient>
  <linearGradient id="eyes" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffdc74"/><stop offset=".55" stop-color="#ff9e2e"/><stop offset="1" stop-color="#f75c30"/></linearGradient>
  <linearGradient id="cloth" x1=".2" y1="0" x2="1" y2="1"><stop stop-color="#39c1b8"/><stop offset=".6" stop-color="#117f84"/><stop offset="1" stop-color="#0d4555"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#f79a3d" stop-opacity=".36"/><stop offset="1" stop-color="#f7772b" stop-opacity="0"/></radialGradient>
  <g id="head">
    <!-- pointed ears and dark rough fur silhouette -->
    <path d="M-37-24 Q-50-53-44-80 Q-18-66-12-49 Q0-56 13-49 Q21-65 43-80 Q50-53 37-25 Z" fill="#20242e" stroke="#101820" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-40-69 Q-21-60-19-42 L-36-34 Q-42-51-40-69Z M40-69 Q21-60 19-42 L36-34 Q42-51 40-69Z" fill="url(#ear)"/>
    <path d="M-54-12 L-47-30 L-43-38 L-31-44 L-25-51 L-13-47 L-4-55 L5-48 L15-53 L27-43 L40-42 L47-28 L54-11 L49 1 L57 7 L45 13 L51 23 L32 23 L24 31 L0 38 L-24 31 L-34 23 L-49 23 L-44 11 L-55 5Z" fill="url(#fur)" stroke="#141a24" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M-36-29 Q-19-49-7-39 L0-47 L11-38 Q30-45 38-27 Q16-32 4-23 Q-18-33-36-29Z" fill="#77808b" opacity=".35"/>
    <path d="M-45 0 Q-34-16-13-9 L0-2 Q15-15 37-6 L49 2 Q41 27 17 29 Q0 34-20 29 Q-43 24-45 0Z" fill="url(#muzzle)" stroke="#28313b" stroke-width="2"/>
    <path d="M-43-9 Q-33-23-14-19 Q-8-14-11-9 Q-22-2-40-8Z M12-10 Q12-23 34-21 Q45-16 44-9 Q27-1 12-10Z" fill="#171e26"/>
    <path d="M-39-12 Q-28-20-16-15 Q-28-10-39-12Z M16-15 Q31-21 41-12 Q29-10 16-15Z" fill="#df7e39" opacity=".5"/>
    <ellipse cx="-25" cy="-14" rx="9" ry="5.4" fill="url(#eyes)"/>
    <ellipse cx="27" cy="-14" rx="9" ry="5.4" fill="url(#eyes)"/>
    <ellipse cx="-24" cy="-14" rx="2.5" ry="4.3" fill="#191721"/>
    <ellipse cx="28" cy="-14" rx="2.5" ry="4.3" fill="#191721"/>
    <circle cx="-28" cy="-16" r="1.7" fill="#fff0c0"/><circle cx="24" cy="-16" r="1.7" fill="#fff0c0"/>
    <path d="M-38-24 Q-27-29-15-22 M15-22 Q28-30 40-24" fill="none" stroke="#222732" stroke-width="5" stroke-linecap="round"/>
    <path d="M-10 6 Q0-1 10 6 L4 13 Q0 17-5 13Z" fill="#151b22" stroke="#11161d" stroke-width="1.6"/>
    <ellipse cx="-4" cy="7" rx="2.3" ry=".9" fill="#9da4a8" opacity=".55"/>
    <path d="M-12 17 Q0 26 12 17" fill="none" stroke="#1b1d23" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M-35 14 L-42 25 L-27 21 M35 14 L42 25 L27 21" fill="#3a424d" opacity=".8"/>
    <path d="M-13-41 L-6-50 L0-40 L6-50 L15-39" fill="none" stroke="#9296a1" opacity=".35" stroke-width="3"/>
  </g>
</defs>

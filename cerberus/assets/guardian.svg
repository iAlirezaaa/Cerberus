<path d="M183 193 L183 220 M172 200 L183 193 L194 200 M174 200 L174 210 M192 200 L192 210" fill="none" stroke="#ffc06b" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M174 201 L171 205 M192 201 L196 205" stroke="#fa874a" stroke-width="1.5"/>
